apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


# Instruct Kustomize to pull and render the Kyverno Helm chart inline
helmCharts:
  - name: kyverno
    releaseName: kyverno
    version: 3.2.6 # Use your target Kyverno chart version
    repo: https://kyverno.github.io/kyverno/
    namespace: kyverno
    valuesFile: values.yaml # Optional: remove if you want default values