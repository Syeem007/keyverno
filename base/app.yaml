apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Syeem007/keyverno.git'
    targetRevision: main
    path: base
    kustomize:
      buildOptions: "--enable-helm"
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true  # Automatically creates the missing 'kyverno' namespace
      - ServerSideApply=true  # Fixes the 262144 bytes annotation size error on large CRDs
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /rules