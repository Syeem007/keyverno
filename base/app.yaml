apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/your-org/your-git-repo.git' # Update to your repo URL
    targetRevision: HEAD
    path: kyverno/base # Path where your kustomization.yaml lives
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true # Required for large CRDs in Kyverno
  ignoreDifferences:
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
      jsonPointers:
        - /rules # Prevents diff noise on dynamic aggregated cluster roles